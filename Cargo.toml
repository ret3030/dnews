[package]
name = "dnews"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, minimal terminal news reader with Reader View."
repository = "https://github.com/ret3030/dnews"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
ego-tree = "0.6"
feed-rs = "2.4.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
readability-rust = "0.1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.18"
tokio = { version = "1.53.1", features = ["full"] }
